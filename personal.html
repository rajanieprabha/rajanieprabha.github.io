  <script>
    const toggle = document.getElementById('dark-mode-toggle');
    const body = document.body;
    toggle.textContent = body.classList.contains('dark-mode') ? '🌓' : '🌞';
    toggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      toggle.textContent = body.classList.contains('dark-mode') ? '🌓' : '🌞';
    });
  </script>
